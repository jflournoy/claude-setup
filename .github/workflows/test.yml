name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the tests use node --test and the code imports only
      # Node builtins. If this ever needs `npm ci`, a dependency crept in.
      - name: Run tests
        run: node --test test/*.test.js
